<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Yora.tj — 160x600</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;padding:28px;background:#0e0e12;color:#e8e6f0;
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:baseline;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  h1{margin:0;font-size:17px;font-weight:650}
  .hint{color:#8b8798}
  button{font:inherit;padding:6px 14px;border-radius:999px;cursor:pointer;
    border:1px solid #3a3550;background:#1b1826;color:#e8e6f0}
  button:hover{background:#252036}
  .row{display:flex;gap:22px;flex-wrap:wrap}
  figure{margin:0}
  iframe{width:160px;height:600px;border:0;display:block;background:#7b3ff2}
  figcaption{margin-top:9px;font-size:12px;color:#8b8798}
  figcaption b{display:block;color:#e8e6f0;font-weight:600}
</style>
</head>
<body>
<header>
  <h1>Yora.tj — 6 креативов 160×600</h1>
  <span class="hint">анимация 5 с × 3 прохода, дальше стоп на CTA-кадре</span>
  <button id="replay">Проиграть заново</button>
</header>
<div class="row" id="row"></div>
<script>
  const BANNERS = [
    ['employer-ru',  'Работодателю', 'RU · Найдите своего сотрудника'],
    ['employer-tg',  'Работодателю', 'TG · Корманди худро пайдо кунед'],
    ['jobseeker-ru', 'Соискателю',   'RU · У нас вакансия'],
    ['jobseeker-tg', 'Соискателю',   'TG · Мо ҷойи корӣ дорем'],
    ['brand-ru',     'Имиджевый',    'RU · Вакансии по всему Таджикистану'],
    ['brand-tg',     'Имиджевый',    'TG · Ҷойҳои корӣ дар тамоми Тоҷикистон'],
  ];

  const row = document.getElementById('row');
  for (const [slug, group, label] of BANNERS) {
    const fig = document.createElement('figure');
    const frame = document.createElement('iframe');
    frame.src = 'out/' + slug + '/160x600/index.html';
    frame.title = label;
    const cap = document.createElement('figcaption');
    const name = document.createElement('b');
    name.textContent = group;
    cap.append(name, label);
    fig.append(frame, cap);
    row.append(fig);
  }

  document.getElementById('replay').addEventListener('click', () => {
    for (const f of document.querySelectorAll('iframe')) f.src = f.src;
  });
</script>
</body>
</html>
